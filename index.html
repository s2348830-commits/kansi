<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 左側：チャンネル一覧 -->
        <div class="sidebar channels-sidebar">
            <h3 id="server-name">サーバー名</h3>
            <div id="channels-list"></div>
        </div>

        <!-- 中央：チャットエリア -->
        <div class="chat-area">
            <div class="chat-header">
                <h3 id="current-channel-name"># チャンネルを選択してください</h3>
            </div>
            <div class="messages" id="messages-list">
                <!-- メッセージがここに追加されます -->
            </div>
        </div>

        <!-- 右側：メンバー一覧 -->
        <div class="sidebar members-sidebar">
            <h3>オンライン</h3>
            <div id="members-online"></div>
            <h3 style="margin-top: 20px;">オフライン</h3>
            <div id="members-offline"></div>
        </div>
    </div>

    <!-- Socket.ioのクライアント用スクリプト -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentChannelId = null;
        let localCache = { messages: {} };

        socket.on('init_state', (data) => {
            document.getElementById('server-name').innerText = data.guild_name;
            localCache = data;
            
            renderChannels();
            renderMembers();
            
            if (data.channels.length > 0 && !currentChannelId) {
                selectChannel(data.channels[0].id, data.channels[0].name);
            }
        });

        socket.on('new_message', (msg) => {
            if (!localCache.messages[msg.channel_id]) {
                localCache.messages[msg.channel_id] = [];
            }
            localCache.messages[msg.channel_id].push(msg);
            
            if (msg.channel_id === currentChannelId) {
                appendMessage(msg);
            }
        });

        socket.on('presence_update', (data) => {
            const member = localCache.members.find(m => m.id === data.id);
            if (member) {
                member.status = data.status;
                renderMembers();
            }
        });

        function renderChannels() {
            const list = document.getElementById('channels-list');
            list.innerHTML = '';
            localCache.channels.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = `# ${ch.name}`;
                div.onclick = () => selectChannel(ch.id, ch.name);
                list.appendChild(div);
            });
        }

        function renderMembers() {
            const onlineList = document.getElementById('members-online');
            const offlineList = document.getElementById('members-offline');
            onlineList.innerHTML = '';
            offlineList.innerHTML = '';

            localCache.members.forEach(member => {
                const div = document.createElement('div');
                div.className = 'member-item';
                
                const avatarUrl = member.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
                let statusColor = '#747f8d';
                if (member.status === 'online') statusColor = '#43b581';
                if (member.status === 'idle') statusColor = '#faa61a';
                if (member.status === 'dnd') statusColor = '#f04747';

                div.innerHTML = `
                    <div class="avatar-container">
                        <img src="${avatarUrl}" class="avatar">
                        <div class="status-indicator" style="background-color: ${statusColor}"></div>
                    </div>
                    <span>${member.name}</span>
                `;

                if (member.status === 'offline') {
                    div.style.opacity = '0.5';
                    offlineList.appendChild(div);
                } else {
                    onlineList.appendChild(div);
                }
            });
        }

        function selectChannel(id, name) {
            currentChannelId = id;
            document.getElementById('current-channel-name').innerText = `# ${name}`;
            
            const msgList = document.getElementById('messages-list');
            msgList.innerHTML = '';
            
            const messages = localCache.messages[id] || [];
            messages.forEach(msg => appendMessage(msg));
        }

        // メッセージと画像を描画する処理
        function appendMessage(msg) {
            const list = document.getElementById('messages-list');
            const div = document.createElement('div');
            div.className = 'message-item';
            
            const avatarUrl = msg.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
            
            // 画像のみ送られてテキストが無い場合にも対応
            const content = (msg.content || '').replace(/\n/g, '<br>');

            // 添付画像のHTMLタグを生成
            let attachmentsHtml = '';
            if (msg.attachments && msg.attachments.length > 0) {
                attachmentsHtml = '<div class="message-attachments">';
                msg.attachments.forEach(url => {
                    attachmentsHtml += `<img src="${url}" class="message-attachment" alt="添付画像">`;
                });
                attachmentsHtml += '</div>';
            }

            div.innerHTML = `
                <img src="${avatarUrl}" class="avatar">
                <div style="flex: 1;">
                    <div class="message-author">${msg.author}</div>
                    <div class="message-content">${content}</div>
                    ${attachmentsHtml}
                </div>
            `;
            list.appendChild(div);
            // 一番下にスクロール（画像読み込み後にもスクロールできるように少し遅延）
            setTimeout(() => {
                list.scrollTop = list.scrollHeight;
            }, 100);
        }
    </script>
</body>
</html>
